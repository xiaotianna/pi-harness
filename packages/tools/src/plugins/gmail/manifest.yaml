id: gmail
displayName: Gmail
apiUrl: https://gmail.googleapis.com
description: Search Gmail messages, threads, labels, and attachments in a connected Google account.
category: productivity
type: oauth
gateway:
  allowedPaths:
    - '^/gmail/v1/users/[^/]+/(?:messages|threads|labels)/?$'
    - '^/gmail/v1/users/[^/]+/(?:messages|threads)/[^/]+/?$'
    - '^/gmail/v1/users/[^/]+/messages/[^/]+/attachments/[^/]+/?$'
oauth:
  authorizationParams:
    access_type: offline
    prompt: consent
  authorizationPath: https://accounts.google.com/o/oauth2/v2/auth
  tokenPath: https://oauth2.googleapis.com/token
  clientId: ''
  clientSecret: ''
  pkce: true
  tokenAuth: body
  tokenFormat: form
  scopes:
    - openid
    - email
    - profile
    - https://www.googleapis.com/auth/gmail.readonly
  profile:
    source: id-token
    idField: sub
    usernameField: email
    displayNameField: name
    avatarUrlField: picture
skills:
  - id: gmail-message-search
    displayName: 邮件检索
  - id: gmail-thread-summary
    displayName: 会话总结
