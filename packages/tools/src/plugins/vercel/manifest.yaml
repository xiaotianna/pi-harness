id: vercel
displayName: Vercel
apiUrl: https://api.vercel.com
description: Vercel ecosystem development guidance, deployment workflows, and connected project diagnostics.
category: developer
type: oauth
gateway:
  allowedPaths:
    - '^/v2/(?:user|teams(?:/[^/]+(?:/members)?)?)/?$'
    - '^/v9/projects/?$'
    - '^/v9/projects/[^/]+(?:/(?:domains|env)(?:/[^/]+)?)?/?$'
    - '^/v(?:2|3|6|13)/deployments(?:/[^/]+(?:/(?:aliases|events|files))?)?/?$'
  deniedQueryValues:
    decrypt: ['true']
oauth:
  authorizationParams:
    prompt: consent
  authorizationPath: https://vercel.com/oauth/authorize
  tokenPath: https://api.vercel.com/login/oauth/token
  clientId: ''
  clientSecret: ''
  pkce: true
  tokenAuth: body
  tokenFormat: form
  scopes: [openid, email, profile, offline_access]
  profile:
    source: userinfo
    method: POST
    path: /login/oauth/userinfo
    idField: sub
    usernameField: preferred_username
    displayNameField: name
    avatarUrlField: picture
