id: github
displayName: GitHub
apiUrl: https://api.github.com
description: Search repositories, review pull requests, manage issues, and diagnose Actions.
category: developer
type: oauth
gateway:
  allowedPaths:
    - '^/user(?:/repos)?/?$'
    - '^/users/[^/]+(?:/repos)?/?$'
    - '^/search/(?:repositories|issues|users|code|commits|topics|labels)/?$'
    - '^/repos/[^/]+/[^/]+(?:/.*)?$'
  headers:
    Accept: application/vnd.github+json
oauth:
  authorizationPath: https://github.com/login/oauth/authorize
  tokenPath: https://github.com/login/oauth/access_token
  clientId: ''
  clientSecret: ''
  pkce: true
  tokenAuth: body
  tokenFormat: form
  scopes: [repo, user]
  profile:
    source: userinfo
    path: /user
    idField: id
    usernameField: login
    displayNameField: name
    avatarUrlField: avatar_url
skills:
  - id: github-repository-search
    displayName: 仓库检索
  - id: github-pull-request-review
    displayName: Pull Request 审查
  - id: github-issue-management
    displayName: Issue 管理
  - id: github-actions-diagnostics
    displayName: Actions 诊断
