id: google
displayName: Google
apiUrl: https://www.googleapis.com
description: Search Drive files and review calendar schedules in a connected Google account.
category: productivity
type: oauth
gateway:
  allowedPaths:
    - '^/drive/v3/files(?:/[^/]+)?/?$'
    - '^/calendar/v3/users/[^/]+/calendarList/?$'
    - '^/calendar/v3/calendars/[^/]+/events/?$'
oauth:
  authorizationParams:
    access_type: offline
    prompt: consent
  authorizationPath: https://accounts.google.com/o/oauth2/v2/auth
  tokenPath: https://oauth2.googleapis.com/token
  clientId: ''
  clientSecret: ''
  pkce: true
  tokenAuth: body
  tokenFormat: form
  scopes:
    - openid
    - email
    - profile
    - https://www.googleapis.com/auth/drive.readonly
    - https://www.googleapis.com/auth/calendar.readonly
  profile:
    source: id-token
    idField: sub
    usernameField: email
    displayNameField: name
    avatarUrlField: picture
skills:
  - id: google-drive-search
    displayName: Drive 检索
    icon: google-drive.svg
  - id: google-calendar-agenda
    displayName: 日程查询
    icon: google-calendar.svg
