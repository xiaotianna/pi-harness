id: slack
displayName: Slack
apiUrl: http://127.0.0.1:4003
description: Search workspace messages and summarize channel activity through the local Slack emulator.
category: productivity
type: oauth
oauth:
  authorizationPath: /oauth/v2/authorize
  tokenPath: /api/oauth.v2.access
  scopes:
    - channels:read
    - channels:history
    - groups:read
    - groups:history
    - users:read
    - users.profile:read
  profile:
    source: userinfo
    method: POST
    path: /api/auth.test
    idField: user_id
    usernameField: user
    displayNameField: team
skills:
  - id: slack-message-search
    displayName: 消息检索
  - id: slack-channel-summary
    displayName: 频道总结
