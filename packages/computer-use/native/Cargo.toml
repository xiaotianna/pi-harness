[package]
name = "pi-computer-use-helper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
axuielement = "0.9.1"
base64 = "0.22.1"
core-graphics = { version = "0.25.0", features = ["elcapitan", "highsierra"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "block2", "libc", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSDate", "NSObjCRuntime", "NSRunLoop", "NSString", "std"] }
png = "0.17.16"
screencapturekit = { version = "10.0.3", features = ["macos_14_0"] }

[profile.release]
lto = "thin"
strip = true
