vercel:
  port: 4000
  users:
    - username: developer
      name: Developer
      email: developer@example.com
  projects:
    - name: web-app
      framework: nextjs
  integrations:
    - client_id: pi-harness-local
      client_secret: pi-harness-local-secret
      name: PI Harness Local Skills
      redirect_uris:
        - http://127.0.0.1:4310/api/skill-connections/vercel/oauth/callback

github:
  port: 4001
  users:
    - login: octocat
      name: The Octocat
      email: octocat@github.com
  repos:
    - owner: octocat
      name: hello-world
      description: Local GitHub OAuth and Skill gateway fixture
      language: TypeScript
      auto_init: true
  oauth_apps:
    - client_id: pi-harness-local
      client_secret: pi-harness-local-secret
      name: PI Harness Local Skills
      redirect_uris:
        - http://127.0.0.1:4310/api/skill-connections/github/oauth/callback

google:
  port: 4002
  users:
    - email: developer@example.com
      name: Developer
  oauth_clients:
    - client_id: pi-harness-local
      client_secret: pi-harness-local-secret
      redirect_uris:
        - http://127.0.0.1:4310/api/skill-connections/google/oauth/callback
  calendars:
    - id: primary
      user_email: developer@example.com
      summary: developer@example.com
      primary: true
  drive_items:
    - id: drv_docs
      user_email: developer@example.com
      name: Docs
      mime_type: application/vnd.google-apps.folder
      parent_ids: [root]

slack:
  port: 4003
  team:
    name: PI Harness
    domain: pi-harness
  users:
    - name: developer
      real_name: Developer
      email: developer@example.com
  channels:
    - name: general
      topic: General discussion
  oauth_apps:
    - client_id: pi-harness-local
      client_secret: pi-harness-local-secret
      name: PI Harness Local Skills
      redirect_uris:
        - http://127.0.0.1:4310/api/skill-connections/slack/oauth/callback
      scopes:
        - channels:read
        - channels:history
        - groups:read
        - groups:history
        - users:read
        - users.profile:read

apple:
  port: 4004
  users:
    - email: developer@icloud.com
      name: Developer
      given_name: Developer
      family_name: User
  oauth_clients:
    - client_id: pi-harness-local
      team_id: PIHARNESS
      name: PI Harness Local Skills
      redirect_uris:
        - http://127.0.0.1:4310/api/skill-connections/apple/oauth/callback

microsoft:
  port: 4005
  users:
    - email: developer@outlook.com
      name: Developer
      given_name: Developer
      family_name: User
  oauth_clients:
    - client_id: pi-harness-local
      client_secret: pi-harness-local-secret
      name: PI Harness Local Skills
      redirect_uris:
        - http://127.0.0.1:4310/api/skill-connections/microsoft/oauth/callback

aws:
  port: 4007
  region: us-east-1
  s3:
    buckets:
      - name: pi-harness-assets
  sqs:
    queues:
      - name: pi-harness-events
  iam:
    users:
      - user_name: developer
    roles:
      - role_name: pi-harness-readonly
        description: Local read-only fixture
